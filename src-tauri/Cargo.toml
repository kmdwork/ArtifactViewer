[package]
name = "artifact-viewer"
version = "0.1.0"
description = "A local viewer for AI-generated HTML artifacts"
authors = ["Artifact Viewer contributors"]
edition = "2021"

[lib]
name = "artifact_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
